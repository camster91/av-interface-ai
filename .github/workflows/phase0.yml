name: Phase 0 proof

on:
  push:
    branches: [main, phase-0-proof]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - name: Run Phase 0 tests
        run: npm test
      - name: Run deterministic demo
        run: npm run demo > /tmp/phase0-output.json

  crestron-toolchain-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install current Crestron CLIs
        run: |
          npm install --no-save \
            @crestron/ch5-utilities-cli@2.19.0 \
            @crestron/ch5-shell-utilities-cli@2.19.1
      - name: Verify Crestron CLIs
        run: |
          npx ch5-cli --help
          npx ch5-shell-cli --help
      - name: Prove CH5 archive command works
        run: |
          mkdir -p /tmp/ch5-smoke /tmp/ch5-out
          printf '%s\n' '<!doctype html><html><body>AV Interface AI Phase 0</body></html>' > /tmp/ch5-smoke/index.html
          npx ch5-cli archive -p phase0-smoke -d /tmp/ch5-smoke -o /tmp/ch5-out
          test -f /tmp/ch5-out/phase0-smoke.ch5z
          unzip -l /tmp/ch5-out/phase0-smoke.ch5z
      - name: Create current Crestron template project
        run: |
          mkdir -p /tmp/crestron-current
          cd /tmp/crestron-current
          npx ch5-shell-cli create:project --projectName "phase0-shell"
          test -f phase0-shell/package.json
          node -e "const p=require('./phase0-shell/package.json'); console.log(JSON.stringify({name:p.name,scripts:p.scripts,dependencies:p.dependencies,devDependencies:p.devDependencies},null,2))"
      - name: Install current template dependencies
        run: |
          cd /tmp/crestron-current/phase0-shell
          npm install
      - name: Build current Crestron template project
        run: |
          cd /tmp/crestron-current/phase0-shell
          npm run build:prod
          find dist -maxdepth 4 -type f -print | sort
      - name: Archive current Crestron template project
        run: |
          cd /tmp/crestron-current/phase0-shell
          npm run build:archive
          find dist -type f -name '*.ch5z' -print
          CH5Z="$(find dist -type f -name '*.ch5z' | head -n 1)"
          test -n "$CH5Z"
          unzip -l "$CH5Z"
