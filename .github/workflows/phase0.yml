name: Phase 0 proof

on:
  push:
    branches: [main, phase-0-proof]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Phase 0 tests
        run: npm test
      - name: Run deterministic demo
        run: npm run demo > /tmp/phase0-output.json
